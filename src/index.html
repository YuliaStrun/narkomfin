<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
  <link rel="stylesheet" href="../public/style.css">
  <title>Narkomfin house</title>
</head>
<body>

  <div class="narkomfin-canvas-container">
    <div class="narkomfin-progress-label">Loading interactive environment</div>
  </div>

  <button class="theme-switcher">day</button>
  <button class="bookstore-tween">bookstore</button>
  <button class="cafe-tween">cafe</button>
  <button class="roof-tween">roof</button>
  <button class="init-tween">init</button>

  <div class="left"></div>
  <div class="right" hide></div>

  <script type="module">
    import init from "./main.ts"

    const container = document.querySelector(".narkomfin-canvas-container")
    const progressLabel = container.querySelector(".narkomfin-progress-label")
    const contentSidebar = document.querySelector(".right")

    const themeOrder = ["day", "night", "deep_night"]
    let themeIndex = 0

    // Determine initial theme based on URL
    const search = window.location.search
    if (search.includes("night")) themeIndex = 1
    if (search.includes("deep_night")) themeIndex = 2

    let cameraType = "init"
    if (search.includes("bookstore")) cameraType = "bookstore"
    else if (search.includes("cafe")) cameraType = "cafe"
    else if (search.includes("roof")) cameraType = "roof"

    init({
      container,
      path: "../public/model/",
      onProgress: (type, percent) => {
        if (type === "LOADING") {
          progressLabel.textContent = `Loading model ${percent}%`
        } else {
          container.removeChild(progressLabel)
        }
      },
      cameraType,
      themeMode: themeOrder[themeIndex],
    })
    .then((e) => {
      if (e.error) return

      const { toggleTheme, tweenCamera, switchBg, setCameraViewOffset } = e

      document.querySelector(".theme-switcher")?.addEventListener("click", () => {
        themeIndex = (themeIndex + 1) % themeOrder.length
        toggleTheme(themeOrder[themeIndex])
        document.querySelector(".theme-switcher").textContent = themeOrder[themeIndex]
      })

      document.querySelector(".bookstore-tween")?.addEventListener("click", () => {
        tweenCamera("bookstore")
        setCameraViewOffset(true)
        contentSidebar.toggleAttribute("hide", false)
      })

      document.querySelector(".cafe-tween")?.addEventListener("click", () => {
        tweenCamera("cafe")
        setCameraViewOffset(true)
        contentSidebar.toggleAttribute("hide", false)
      })

      document.querySelector(".roof-tween")?.addEventListener("click", () => {
        tweenCamera("roof")
        setCameraViewOffset(true)
        contentSidebar.toggleAttribute("hide", false)
      })

      document.querySelector(".init-tween")?.addEventListener("click", () => {
        tweenCamera("init")
        setCameraViewOffset(false)
        contentSidebar.toggleAttribute("hide", true)
      })
    })
  </script>
</body>
</html>
